options:
  do_ocr: false
  to_formats:
    - json

sources:
  - kind: sharepoint
    tenant: "contoso.onmicrosoft.com" # Entra tenant id
    client_id: "" # app registration client ID
    client_secret: "" # App-only client secret

    # target: provide either site_url (SharePoint) or onedrive_user (OneDrive)
    site_url: "https://contoso.sharepoint.com/sites/Marketing" # SharePoint site
    # onedrive_user: "alice@contoso.com" # OneDrive for Business user (only Entra-backed accounts)

    # optional params
    #document_library: "" # library display name (SharePoint only); default = site's default library
    #folder_path: "" # folder within the drive, default is root which recurses subfolders
    #file_ids: [] # explicit item ids, if set overrides folder traversal
    #max_num_elements: # set this to cap it to a specific num, default is all

target:
    kind: sharepoint
    tenant: "contoso.onmicrosoft.com" # Entra tenant id
    client_id: "" # app registration client ID
    client_secret: "" # App-only client secret

    # target: provide either site_url (SharePoint) or onedrive_user (OneDrive)
    site_url: "https://contoso.sharepoint.com/sites/Marketing" # SharePoint site
    # onedrive_user: "alice@contoso.com" # OneDrive for Business user (only Entra-backed accounts)

    # optional params
    #document_library: "" # library display name (SharePoint only); default = site's default library
    #folder_path: "" # folder within the drive, default is root which recurses subfolders