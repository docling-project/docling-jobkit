options:
  do_ocr: false
  # to_formats: 

sources:
  - kind: spark
    host: my-spark-host
    port: 443
    # user_id: my-user # optional: for multi-tenant spark clusters
    # Omit auth to use local/no auth path
    # --- Option A: Databricks classic authentication ---
    auth:
      kind: databricks_classic
      token: YOUR_DATABRICKS_PAT
      cluster_id: 0101-000000-abcdef12
    # --- Option B: Databricks serverless authentication ---
    auth:
      kind: databricks_classic
      token: YOUR_DATABRICKS_PAT
      http_path: /sql/1.0/warehouses/abc123
    # --- Option C: Bearer Token authentication ---
    # auth:
    #   kind: token
    #   token: YOUR_BEARER_TOKEN
    table: main.docling.converted_docs
    content_column: content     # the name of the column containing the raw file bytes
    # optional params
    # filename_column: filename # column holding document file names
    # max_num_elements: 100     # optional cap on elements fetched    

targets:
  - kind: spark_doc
    host: my-spark-host
    port: 443
    #   user_id: my-user # optional: for multi-tenant spark clusters
    # Omit auth to use local/no auth path
    # --- Option A: Databricks classic authentication ---
    auth:
      kind: databricks_classic
      token: YOUR_DATABRICKS_PAT
      cluster_id: 0101-000000-abcdef12
    # --- Option B: Databricks serverless authentication ---
    auth:
      kind: databricks_classic
      token: YOUR_DATABRICKS_PAT
      http_path: /sql/1.0/warehouses/abc123
    # --- Option C: Bearer Token authentication ---
    # auth:
    #   kind: token
    #   token: YOUR_BEARER_TOKEN
    table: main.docling.converted_docs
    table_format: delta   # delta: idempotent MERGE upsert; non-delta (e.g. parquet): append (at-least-once)
    mappings:
      MARKDOWN: text
      JSON: doc_json
    # optional params
    # partition_column: ingest_date  # table's partition column, only needed for distributed modes
    # doc_id_field: doc_id  # used as Merge upsert key and id, defaults to doc_id
    # flush_batch_size: 100 # num of rows per batch write, defaults to 100
    
  - kind: spark_chunks
    host: my-spark-host
    port: 443
#   user_id: my-user # optional: for multi-tenant spark clusters
    # Omit auth to use local/no auth path
    # --- Option A: Databricks classic authentication ---
    auth:
      kind: databricks_classic
      token: YOUR_DATABRICKS_PAT
      cluster_id: 0101-000000-abcdef12
    # --- Option B: Databricks serverless authentication ---
    auth:
      kind: databricks_classic
      token: YOUR_DATABRICKS_PAT
      http_path: /sql/1.0/warehouses/abc123
    # --- Option C: Bearer Token authentication ---
    # auth:
    #   kind: token
    #   token: YOUR_BEARER_TOKEN
    table: main.docling.doc_chunks
    table_format: delta   # delta: idempotent MERGE upsert; non-delta (e.g. parquet): append (at-least-once)
    # optional params
    # chunk_id_field: chunk_id  # used as Merge upsert key and id, defaults to doc_id
    # text_field: text                   # chunk text column (defaults to text)
    # metadata_field: metadata           # chunk metadata column (defaults to metadata)
    # flush_batch_size: 100 # num of rows per batch write, defaults to 100

  